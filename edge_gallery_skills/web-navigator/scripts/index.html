<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>web-navigator</title></head>
<body>
<script>
const MAX_PAGE_CHARS = 8000;
const MAX_RESULTS = 6;

// Detects which search provider a key belongs to. Explicit prefixes
// ("serpapi:KEY", "serper:KEY", "jina:KEY") always win; otherwise:
// jina_... -> Jina, 64-char hex -> SerpAPI, anything else -> Serper.
function detectProvider(secret) {
  const s = (secret || '').trim();
  const m = s.match(/^(serpapi|serper|jina):(.+)$/i);
  if (m) return { provider: m[1].toLowerCase(), key: m[2].trim() };
  if (s.startsWith('jina_')) return { provider: 'jina', key: s };
  if (/^[0-9a-f]{64}$/i.test(s)) return { provider: 'serpapi', key: s };
  return { provider: 'serper', key: s };
}

function isJinaKey(secret) {
  return detectProvider(secret).provider === 'jina';
}

function formatGoogleResults(query, answerBox, knowledgeGraph, organic) {
  const lines = [];
  if (answerBox) {
    const answer = answerBox.answer || answerBox.snippet || '';
    if (answer) lines.push('DIRECT ANSWER: ' + answer + (answerBox.link ? ' (source: ' + answerBox.link + ')' : ''));
  }
  if (knowledgeGraph) {
    const desc = [knowledgeGraph.title, knowledgeGraph.type, knowledgeGraph.description]
      .filter(Boolean).join(' — ');
    if (desc) lines.push('KNOWLEDGE: ' + desc);
  }
  (organic || []).slice(0, MAX_RESULTS).forEach((r, i) => {
    lines.push((i + 1) + '. ' + (r.title || '(no title)') + '\n   URL: ' + (r.link || '') +
      '\n   ' + (r.snippet || ''));
  });
  if (lines.length === 0) return 'No results found for: ' + query;
  return 'SEARCH RESULTS for "' + query + '":\n\n' + lines.join('\n\n');
}

async function searchWithSerper(query, gl, hl, key) {
  const resp = await fetch('https://google.serper.dev/search', {
    method: 'POST',
    headers: {
      'X-API-KEY': key,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ q: query, num: MAX_RESULTS, gl: gl, hl: hl })
  });
  if (!resp.ok) {
    throw new Error('Serper API returned HTTP ' + resp.status +
      '. Check that your Serper API key is valid and has remaining credits (https://serper.dev).');
  }
  const json = await resp.json();
  return formatGoogleResults(query, json.answerBox, json.knowledgeGraph, json.organic);
}

async function searchWithSerpApi(query, gl, hl, key) {
  const params = 'engine=google&q=' + encodeURIComponent(query) +
    '&gl=' + encodeURIComponent(gl) + '&hl=' + encodeURIComponent(hl) +
    '&num=' + MAX_RESULTS + '&api_key=' + encodeURIComponent(key);
  const resp = await fetch('https://serpapi.com/search.json?' + params);
  if (!resp.ok) {
    throw new Error('SerpAPI returned HTTP ' + resp.status +
      '. Check that your SerpAPI key is valid and has remaining monthly quota (https://serpapi.com).');
  }
  const json = await resp.json();
  if (json.error) throw new Error('SerpAPI error: ' + json.error);
  return formatGoogleResults(query, json.answer_box, json.knowledge_graph, json.organic_results);
}

async function searchWithJina(query, secret) {
  const resp = await fetch('https://s.jina.ai/?q=' + encodeURIComponent(query), {
    method: 'GET',
    headers: {
      'Authorization': 'Bearer ' + secret.trim(),
      'Accept': 'application/json',
      'X-Respond-With': 'no-content'
    }
  });
  if (!resp.ok) {
    throw new Error('Jina Search returned HTTP ' + resp.status +
      '. Check that your Jina API key is valid and has remaining tokens (https://jina.ai).');
  }
  const json = await resp.json();
  const items = (json.data || []).slice(0, MAX_RESULTS);
  if (items.length === 0) return 'No results found for: ' + query;
  const lines = items.map((r, i) =>
    (i + 1) + '. ' + (r.title || '(no title)') + '\n   URL: ' + (r.url || '') +
    '\n   ' + (r.description || ''));
  return 'SEARCH RESULTS for "' + query + '":\n\n' + lines.join('\n\n');
}

async function readPage(url, secret) {
  if (!/^https?:\/\//i.test(url)) {
    throw new Error('Invalid URL: "' + url + '". It must start with http:// or https://');
  }
  const headers = { 'X-Return-Format': 'markdown' };
  const p = detectProvider(secret);
  if (p.provider === 'jina') headers['Authorization'] = 'Bearer ' + p.key;
  const resp = await fetch('https://r.jina.ai/' + url, { method: 'GET', headers: headers });
  if (!resp.ok) {
    throw new Error('Page reader returned HTTP ' + resp.status + ' for ' + url +
      '. The page may be down, blocked, or rate-limited; try again or try another URL.');
  }
  let text = await resp.text();
  if (text.length > MAX_PAGE_CHARS) {
    text = text.slice(0, MAX_PAGE_CHARS) +
      '\n\n[... content truncated at ' + MAX_PAGE_CHARS + ' characters ...]';
  }
  return 'PAGE CONTENT of ' + url + ':\n\n' + text;
}

window['ai_edge_gallery_get_result'] = async (dataStr, secret) => {
  try {
    let data;
    try {
      data = JSON.parse(dataStr);
    } catch (e) {
      return JSON.stringify({ error: 'Invalid JSON in data payload: ' + e.message });
    }
    const action = (data.action || '').toLowerCase();

    if (action === 'search') {
      if (!data.query) return JSON.stringify({ error: 'Missing required field "query" for search action.' });
      if (!secret) {
        return JSON.stringify({ error: 'No API key configured. Add a Serper, SerpAPI or Jina key in the skill settings.' });
      }
      const gl = data.gl || 'ni';
      const hl = data.hl || 'es';
      const p = detectProvider(secret);
      let result;
      if (p.provider === 'jina') result = await searchWithJina(data.query, p.key);
      else if (p.provider === 'serpapi') result = await searchWithSerpApi(data.query, gl, hl, p.key);
      else result = await searchWithSerper(data.query, gl, hl, p.key);
      return JSON.stringify({ result: result });
    }

    if (action === 'read') {
      if (!data.url) return JSON.stringify({ error: 'Missing required field "url" for read action.' });
      const result = await readPage(data.url, secret);
      return JSON.stringify({ result: result });
    }

    return JSON.stringify({ error: 'Unknown action "' + data.action + '". Use "search" or "read".' });
  } catch (e) {
    let msg = e && e.message ? e.message : String(e);
    if (/Failed to fetch|NetworkError|Load failed/i.test(msg)) {
      msg += ' — The request was blocked before reaching the server (no network, or the API does not allow browser/webview requests). If this persists with Serper, switch to a Jina API key (starts with "jina_"), which supports browser requests.';
    }
    return JSON.stringify({ error: msg });
  }
};
</script>
</body>
</html>
